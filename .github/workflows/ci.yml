name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store/v3
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm (v11)
        run: corepack prepare pnpm@11 --activate

      - name: Install pnpm action
        uses: pnpm/action-setup@v2
        with:
          version: '11'

      - name: Verify tooling
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Install dependencies (reproducible)
        # Enforce frozen lockfile to ensure CI reproduces committed resolutions.
        run: pnpm install --frozen-lockfile

      - name: Type check & Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint
